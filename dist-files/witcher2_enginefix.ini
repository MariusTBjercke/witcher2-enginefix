; witcher2_enginefix.ini - must sit next to bin\dinput8.dll
;
; The DLL is a proxy for the system dinput8.dll; the game imports it for controller
; input, so it loads at startup. Delete the DLL and this file to uninstall.

[general]
; 0 turns every patch off (the proxy still forwards input)
enabled=1
; 0 stops writing witcher2_enginefix.log
log=1

[presets]
; One combined control for mesh LOD, foliage, mesh visibility and mesh shadows.
; 0 restores the four independent legacy controls and [lod]/[distance] values.
enabled=1
; Startup selection: baseline / high / ultra / extreme (case insensitive).
; Hotkey changes last until exit; this file is never rewritten by the DLL.
default=extreme
; Cycle baseline -> high -> ultra -> extreme -> baseline, shown on screen.
; Only F9/F10 with Ctrl or Alt are accepted, matching the existing input filter.
cycle=Ctrl+F10

; Each preset is customizable. LOD values must be >0 and <100; distance factors
; must be 1..4. Invalid fields fall back to that preset's built-in value.
; Baseline resets ONLY these four factors; other enginefix features stay active.
[preset.baseline]
mesh_scale=1.0
foliage_scale=1.0
visibility_scale=1.0
shadow_scale=1.0

[preset.high]
mesh_scale=2.0
foliage_scale=2.0
visibility_scale=1.5
shadow_scale=1.5

[preset.ultra]
mesh_scale=4.0
foliage_scale=3.0
visibility_scale=2.0
shadow_scale=2.0

[preset.extreme]
mesh_scale=8.0
foliage_scale=5.0
visibility_scale=3.0
shadow_scale=3.0

[lod]
; With presets enabled, their four values replace the individual scales below,
; and enforce=1 plus [distance] enabled=1 are selected automatically.
; keep the two LOD multipliers pinned to the values below, every ~120 ms.
; This matters when the in-game options menu rewrites them, and it lets the
; active preset or legacy hotkeys change them while playing.
enforce=1
; force the two gameplay LOD downscale flags to 0 (off)
enforce_downscale=1

; LOD distance multiplier, the launcher's "LOD Distance" slider (0.7-1.0 in the
; shipped presets). Values above 1.0 are not clamped by the engine.
mesh_scale=4.0
; foliage multiplier - no launcher control at all, 1.0 max in the presets
foliage_scale=2.0

[hotkeys]
; Enables live switching in either mode; 0 still applies the startup preset.
enabled=1
; The following separate bindings/steps apply only with [presets] enabled=0.
; Ctrl+F9 steps the mesh LOD, Ctrl+F10 steps foliage. Each press walks the matching
; list below and the active value is shown on screen.
;
; F9 is quick load in game and is NOT in Input_QWERTY.ini, so it cannot be rebound.
; With suppress_mod_keys=1 the DLL clears F9/F10 out of the 256-byte keyboard state
; that the engine polls, but only while Ctrl or Alt is held - so Ctrl+F9 does not
; trigger quick load, and plain F9 still does.
cycle_mesh=Ctrl+F9
cycle_foliage=Ctrl+F10
suppress_mod_keys=1

mesh_steps=1.0,2.0,4.0,8.0
foliage_steps=1.0,2.0,3.0,5.0

[distance]
; Fingerprinted Steam 3.5.0.26 renderer hooks; visual improvement confirmed.
; Preset mode activates these hooks automatically. In legacy mode this switch
; controls installation; restart after changing it. Hooks stay installed at 1x.
enabled=1
; Extends the hard visibility cutoff for ALL mesh proxies, including characters
; still loaded by the game. Does not extend actor streaming / spawn distance.
visibility_scale=1.0
; Extends a mesh-caster shadow distance gate; not the sun shadow-map coverage.
shadow_scale=1.0
; Legacy mode only: steps 1 -> 1.5 -> 2 -> 3 -> 1.
cycle_visibility=Ctrl+Shift+F9
cycle_shadow=Ctrl+Shift+F10

[osd]
; the small on-screen readout shown when a value changes
enabled=1
; how long it stays up, milliseconds
ms=2500
; font size in pixels (34 is comfortable at 4K, 22 if you play at 1080p)
size=34

[saves]
; Writes the missing save preview (_640x360.bmp). The game queues its screenshot
; and saves in the same tick, so the finished image arrives about a frame too late
; and is dropped. 1 writes that image to Steam storage under the game's own name.
; Old saves cannot get a picture back. Only the Steam storage backend is handled.
fix_thumbnails=1

[diagnostics]
; 1 logs the save-thumbnail path to witcher2_enginefix.log: Steam FileWrite calls,
; D3DX screenshot encoding results and file calls on .bmp/640x360 paths. Passive -
; nothing is changed. See docs/fixes/save-previews.md. Set 0 when done.
save_trace=0
