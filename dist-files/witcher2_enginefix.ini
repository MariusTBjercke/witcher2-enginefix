; witcher2_enginefix.ini - must sit next to bin\dinput8.dll
;
; The DLL is a proxy for the system dinput8.dll; the game imports it for controller
; input, so it loads at startup. Delete the DLL and this file to uninstall.

[general]
; 0 turns every patch off (the proxy still forwards input)
enabled=1
; 0 stops writing witcher2_enginefix.log
log=1

[presets]
; One combined control for mesh LOD, foliage, mesh visibility, mesh shadows and plant billboards.
; 0 restores the four independent legacy controls and [lod]/[distance] values.
enabled=1
; Startup selection: vanilla / high / ultra / extreme (case insensitive). Vanilla is the game's own.
; Options > Graphics > Draw distance changes the level too (no on-screen text) and the
; game remembers it in Documents\Witcher 2\Config\User.ini (EngineFixDrawDistance);
; once it is stored there it wins over this default. Ctrl+F10 moves that row along with it.
; This file is never rewritten by the DLL.
default=extreme
; Cycle vanilla -> high -> ultra -> extreme -> vanilla, shown on screen.
; Only F9/F10 with Ctrl or Alt are accepted, matching the existing input filter.
cycle=Ctrl+F10

; Each preset is customizable. LOD values must be >0 and <100; distance factors
; must be 1..4; billboard_scale must be 1..8. Invalid fields fall back to that preset's
; built-in value. billboard_scale moves the distance where a plant turns into a flat picture;
; it reaches plants created after the change, so load a save after switching level.
; Vanilla resets ONLY these five factors; other enginefix features stay active.
[preset.vanilla]
mesh_scale=1.0
foliage_scale=1.0
visibility_scale=1.0
shadow_scale=1.0
billboard_scale=1.0

[preset.high]
mesh_scale=2.0
foliage_scale=2.0
visibility_scale=1.5
shadow_scale=1.5
billboard_scale=1.5

[preset.ultra]
mesh_scale=4.0
foliage_scale=3.0
visibility_scale=2.0
shadow_scale=2.0
billboard_scale=2.0

[preset.extreme]
mesh_scale=8.0
foliage_scale=5.0
visibility_scale=3.0
shadow_scale=3.0
billboard_scale=3.0

[lod]
; With presets enabled, their four values replace the individual scales below,
; and enforce=1 plus [distance] enabled=1 are selected automatically.
; keep the two LOD multipliers pinned to the values below, every ~120 ms.
; This matters when the in-game options menu rewrites them, and it lets the
; active preset or legacy hotkeys change them while playing.
enforce=1
; force the two gameplay LOD downscale flags to 0 (off)
enforce_downscale=1

; LOD distance multiplier, the launcher's "LOD Distance" slider (0.7-1.0 in the
; shipped presets). Values above 1.0 are not clamped by the engine.
mesh_scale=4.0
; foliage multiplier - no launcher control at all, 1.0 max in the presets
foliage_scale=2.0

[hotkeys]
; Enables live switching in either mode; 0 still applies the startup preset.
enabled=1
; The following separate bindings/steps apply only with [presets] enabled=0.
; Ctrl+F9 steps the mesh LOD, Ctrl+F10 steps foliage. Each press walks the matching
; list below and the active value is shown on screen.
;
; F9 is quick load in game and is NOT in Input_QWERTY.ini, so it cannot be rebound.
; With suppress_mod_keys=1 the DLL clears F9/F10 out of the 256-byte keyboard state
; that the engine polls, but only while Ctrl or Alt is held - so Ctrl+F9 does not
; trigger quick load, and plain F9 still does.
cycle_mesh=Ctrl+F9
cycle_foliage=Ctrl+F10
suppress_mod_keys=1
; Windows key combinations work in game (Win+Shift+S and Print Screen open the Snipping
; Tool, Win+D, ...). The game blocks them; a Windows key tapped on its own still does not
; open the Start menu. 0 = the game's own block.
windows_keys=1

mesh_steps=1.0,2.0,4.0,8.0
foliage_steps=1.0,2.0,3.0,5.0

[distance]
; Fingerprinted renderer hooks (Steam 3.5.0.26 and GOG 3.5.0.26g); visual improvement confirmed.
; Preset mode activates these hooks automatically. In legacy mode this switch
; controls installation; restart after changing it. Hooks stay installed at 1x.
enabled=1
; Extends the hard visibility cutoff for ALL mesh proxies, including characters
; still loaded by the game. Does not extend actor streaming / spawn distance.
visibility_scale=1.0
; Extends a mesh-caster shadow distance gate; not the sun shadow-map coverage.
shadow_scale=1.0
; Legacy mode only: steps 1 -> 1.5 -> 2 -> 3 -> 1.
cycle_visibility=Ctrl+Shift+F9
cycle_shadow=Ctrl+Shift+F10

[shadows]
; Shadow quality, also a row in Options > Graphics. The sun's shadows come in three zones of
; falling sharpness, with a hard line on the ground where the first one ends. High and ultra move
; that line out until it no longer shows and make shadows sharper, for more video memory and a
; little frame rate. 0 removes the feature and its row's effect; restart after changing it.
enabled=1
; Start level: vanilla (the game's own), high or ultra. A choice made in the options menu is stored in
; Documents\Witcher 2\Config\User.ini (EngineFixShadowQuality) and wins over this.
quality=vanilla
; With [presets] enabled=1: cycles vanilla -> high -> ultra -> vanilla, shown on screen.
cycle=Ctrl+Shift+F10

; Each level is customizable; an invalid field falls back to the level's built-in value.
;   first_distance  7-128   where the sharpest zone ends, the line. The game's is 7.
;   seam_distance   24-256  where the middle zone ends. The game's is 24.
;   sun_distance    64-512  where the shadows end. The game's is 64.
;   atlas           1024, 2048 or 4096: shadow map pixels per zone. The game's is 1024.
;   filter          0.25-1  softness of shadow edges, lower is sharper. The game's is 1.
; Atlas sizes switch with a short pause while the game recreates its graphics resources.
[shadows.high]
first_distance=12
seam_distance=24
sun_distance=64
atlas=2048
filter=0.6

[shadows.ultra]
first_distance=12
seam_distance=24
sun_distance=64
atlas=4096
filter=0.5

[osd]
; the small on-screen readout shown when a value changes
enabled=1
; how long it stays up, milliseconds
ms=2500
; font size in pixels (34 is comfortable at 4K, 22 if you play at 1080p)
size=34

[saves]
; Writes the missing save preview (_640x360.bmp). The game queues its screenshot
; and saves in the same tick, so the finished image arrives about a frame too late
; and is dropped. 1 writes that image under the game's own name: to Steam storage on
; Steam, next to the save in Documents\Witcher 2\gamesaves on GOG. Old saves cannot
; get a picture back.
fix_thumbnails=1
; Each time the Load/Save menu builds its list, the game reads every save's preview
; into memory and drops it again without freeing it when the menu already shows that
; picture (~0.9 MB per save per menu open). 1 frees it. Does not limit saves.
; (GOG's list keeps no previews, so there it has nothing to do.)
fix_list_leak=1
; To show the Load/Save list (and at game start) the game unpacks every save in full
; (on Steam through a temporary copy on disk) to read a few header values: a late save is
; 1.7 MB on disk and 12.5 MB unpacked. 1 unpacks only the parts the list reads
; (2-3 of ~190 blocks), in memory. Same list, same saves; loading a save is unchanged.
; 0 = the game's own. 2 = every other list build (for timing with savelist_trace).
fast_list=1
; The Load menu's preview pictures are 640x360. The game has each one scaled up and given a
; full set of smaller copies when the list is first built, ~18 ms per save on the render
; thread. 1 makes them at their own size with one level, ~2 ms per save. 0 = the game's own.
light_previews=1

[startup]
; 1 starts the game at the main menu, without the logo videos and the intro movie; no startup
; movie is started at all (see docs/fixes/skip-intro.md)
; (the list in CookedPC\globals\video_start.csv is read as usual and marked as
; already played). Works with or without an intro removal mod. 0 = the game's own.
skip_intro=0
; 1 removes the idle wait while the game starts: about 10 s less to the main menu on the
; machine it was measured on. A 1 ms timer from the start, and FMOD's 10 ms waits cut to
; 1 ms until the game window opens. 0 = the game's own.
fast_start=1

[window]
; Display mode: full screen, borderless window or windowed, switched at once from the in-game
; Options > Graphics > Display mode row. Borderless fills the screen without a border at the
; desktop resolution, while Direct3D stays windowed (instant alt-tab).
;
; 0 = nothing installed. 1 = the window patches, the menu channel and the live switch.
enabled=1
; Start borderless (0/1). This line only counts until Options > Graphics has saved the
; option: that value is stored in the game's own User.ini ([Rendering] EngineFixBorderless),
; next to the launcher's settings.
borderless=0
; Make the process DPI-aware when borderless starts on. Without it Windows scales the whole
; window on a display at anything but 100% (3840x2160 would become 5760x3240 and be clipped).
dpi_aware=1

[scriptpatches]
; The script patches (book marker, Continue, pause-menu Quit, Display mode in
; Options > Graphics, medallion), applied at game start without changing the game's files: uninstalling
; is deleting the mod's files. The patched files are built once into
; bin\witcher2_enginefix_cache\ and served to the game from there.
; Delete that folder to force a rebuild. 0 = that feature off, the others stay.
;
; book_marker: Read / Nothing new / Unread after every book in the inventory, shop, trade,
;   storage and loot window, a tooltip listing what a book still gives, and the tick on the
;   icon of a read book (including the loot window and the container preview).
book_marker=1
; continue: "Continue" at the top of the main menu loads the newest save.
continue=1
; pause_quit: "Quit" in the pause menu asks first instead of dropping to the desktop.
pause_quit=1
; window_mode: rows in Options > Graphics: "Display mode" (full screen, borderless window,
;   windowed), "Draw distance" (vanilla, high, ultra, extreme = the [presets] levels) and
;   "Shadow quality" (vanilla, high, ultra = the [shadows] levels). Writes the game's own
;   [Rendering] Fullscreen, EngineFixBorderless, EngineFixDrawDistance and EngineFixShadowQuality
;   keys and applies at once ([window] enabled=1).
window_mode=1
; medallion: the medallion key works at once, also while moving: Geralt keeps going instead of
;   stopping for the animation, and the cooldown is 1 s instead of 2 s. Same pulse, sound
;   and highlights. Quest scripts that use the medallion keep the animation.
medallion=1

[loading]
; Faster house doors. Entering or leaving a house fades to black, swaps in the interior in a
; fraction of a second and then keeps the screen black until the door animation reaches its
; end (~1.2 s more). 1 brings the picture back as soon as the interior is in. 0 = the game's
; own timing. See docs/fixes/load-times.md.
fast_doors=1
; Length of that door fade-out and fade-in in seconds for houses and other interiors (the
; game uses 0.5). With interiors=1 or 2 (below) a house swaps in a tenth of a second, so
; the fade can be all but gone.
door_fade=0.05
; The same for a door that changes area, such as the gate into Flotsam: that is a real
; load (~1 s of black), and a short fade there flashes black. Used when it differs from
; door_fade.
area_fade=0.25
; Seamless interiors: houses, shops and inns without a fade. The game unloads the outdoors around you
; when you go through a door and loads it all again when you come out, behind a fade.
;   2 = keep the outdoors loaded (visible through the windows), and load the interiors of
;       the area together with the area itself (behind the loading screen or the
;       area-change fade): open doors show the real rooms instead of flat boxes and doors
;       go without a fade. Uses some more memory and ~1 s more on loading a save.
;   1 = keep the outdoors loaded, load each interior when you first go in (a short fade
;       the first time); once you have been inside one house, other houses' open doors
;       show nothing until you change area. Use this if 2 gives trouble.
;   0 = the game's own behaviour.
; See docs/fixes/interior-preload.md.
interiors=2
; Seconds the lighting takes to change at a house door without a fade. Inns and houses
; have their own lighting (no sun, other colours, a shorter view) that the game switched in
; one frame behind its fade; without the fade you saw the street or the room jump. The
; game's own default blend for such lighting is 1 s. 0 = switch at once, as the game does.
; See docs/fixes/door-transitions.md.
door_light_blend=1.0
; Loading a save made inside a house also loads its street, so the first walk out does not
; freeze for ~0.4 s. 0 = the street loads at that first door.
preload_street=1
; 1 shows the game's loading spinner in the corner on doors without a fade too. 0 = hidden.
door_spinner=0
; Memory guard. The game is 32-bit (4 GB at most), and with the game's own Direct3D 9 every
; texture also takes room there; at 4K that alone can run out (use DXVK, see the README).
; Preloaded interiors load only while this many MB of address space are free; the rest load
; on their first visit, behind a short fade. 0 = no limit.
preload_memory_mb=1280
; A door between two whole areas (a cave and the land outside it, the quarters of Loc Muinne)
; keeps the area you leave loaded, so the way back loads nothing. With less than this free,
; that area unloads as in the game, behind a short fade; house doors still keep their street.
; 0 = never.
area_memory_mb=1536
; A door that starts with less than this free is the game's own door again (it unloads the
; outdoors), behind a short fade. 0 = never.
door_memory_mb=1024

[stability]
; 1 stops a crash when a physics ray cast meets an object that was just unloaded (seen
; when walking out of the Flotsam inn): the ray misses the object that is gone instead of
; closing the game. 0 = off. See docs/fixes/crash-raycast-stale-body.md.
raycast_guard=1
; 1 lets the game start on a CPU with 32 or more logical processors, where its own CPU
; count never ends and the game stays in the background without a window. Changes nothing on
; other CPUs. 0 = off. See docs/fixes/cpu32-hang.md.
cpu32_guard=1
; 1 keeps the game from crashing while it shuts down after Quit in the pause menu (or any
; quit with an area loaded): a script that records a quest fact then finds the world gone.
; Players never saw it, the game was closing anyway, but crash_dump wrote a dump each time.
; 0 = off. See docs/fixes/quit-crash.md.
quit_guard=1
; 1 frees what the game leaks on every save load: it keeps the stored state of every NPC in
; the world (position, appearance and so on) and loads a new copy from the save, so memory
; fills up over a long session with many loads, and the seamless interiors stop once less
; than ~1.3 GB is free. 0 = the game's own behaviour. See docs/fixes/layer-storage-leak.md.
layer_storage_leak=1
; 1: Quit in the pause menu ends the game session first, as Exit current game does, and closes
; the game from the main menu about 1.5 s later. Quitting straight out with an area loaded
; tears the world down while its characters and cutscenes are still running, and the game
; crashed on the way out (in the prologue's interrogation every time). 0 = quit at once, as
; the game's QuitApplication does. See docs/fixes/quit-crash.md.
clean_quit=1
; 1 stops a freeze in the game's pathfinding (PathEngine): asked about a line whose two ends
; are the same point, it walked around one corner of its mesh for good. Every job behind it
; waited, and the next door or load froze the game. The guard answers such a line at once.
; 0 = the game's own code. See docs/fixes/door-transitions.md.
path_guard=1
; 1 stops a crash while the game reads a text table (a CSV such as knowledge_list.csv, seen
; right after loading a save): it ends a UTF-16 file's text with a single 0 byte where two
; are needed, so the copy could run on past the file into whatever memory follows. The
; reader now gets two more 0 bytes. 0 = the game's own code. See docs/fixes/text-file-terminator.md.
text_guard=1

[diagnostics]
; 1 logs the save-thumbnail path to witcher2_enginefix.log: Steam FileWrite calls,
; D3DX screenshot encoding results and file calls on .bmp/640x360 paths. Passive -
; nothing is changed. See docs/fixes/save-previews.md. Set 0 when done.
save_trace=0
; 1 measures the save list: build time, Steam reads, previews kept in memory and
; process memory before/after each build, plus a memory line every 60 s. Passive -
; the list is built exactly as before. See docs/fixes/save-bloat.md.
savelist_trace=0
; 1 logs how the game opens its data: the file APIs it calls for anything under
; CookedPC and for .dzip/.swf/.dds paths, with path form, size and result. Passive -
; nothing is changed. Research for the DLL script patches. Set 0 when done.
file_trace=0
; 1 measures every loading screen (loading a save, area transitions) and every streaming
; door (entering or leaving an interior): its length, and per game thread the time spent
; reading .dzip and loose files, unpacking archive blocks, sleeping, waiting and presenting
; frames, plus each thread's CPU time; a timeline line every 250 ms, and a line for every
; burst of open-world streaming. Also logs every world-partition switch (which layers
; an interior loads and unloads) and where Geralt and the door are when a door starts
; and ends. Passive - nothing is changed. See docs/fixes/load-times.md.
; Set 0 when done.
load_trace=0
; N > 0 takes a census of the game's memory every N minutes (the first after 2): address space,
; the engine's memory pages by kind, and how many objects of each game class are in memory.
; One line per census in witcher2_enginefix.log with the classes that grew most since the
; first; the full counts go to witcher2_enginefix_memtrace.tsv (the session before is kept as
; .prev.tsv). Passive - nothing is changed; each census reads all of the game's memory on a
; low-priority thread, a second or two. For finding memory leaks over a long session, e.g. 5.
; See docs/fixes/layer-storage-leak.md. 0 = off.
mem_trace=0
; Research, Steam only, off by default: adds script functions of its own (W2EF_*) to the engine's
; global function tables before the game compiles base_scripts.dzip. Proved in game: int, float,
; bool and string arguments and results cross the script VM, and a called native can read live
; engine state (W2EF_MeshDistance returns MeshDistanceScale). A .ws that calls one of them must
; declare it with `import function`, and an `import function` with no registration crashes the
; menu - so no script in this release calls them. See docs/engine-script-bindings.md.
script_bindings=0
; The game's own crash handler closes the game without a word: no error message, no
; Windows error report. 1 writes what crashed (exception, address, module, registers,
; stack) to witcher2_enginefix.log and a small dump (a few MB) next to this file as
; witcher2_enginefix_crash_<date>_<time>.dmp; the newest 5 dumps are kept. 2 writes a
; full memory dump instead (1-3 GB, for a hard case). 0 = off. The previous session's
; log is always kept as witcher2_enginefix.prev.log, so restarting the game after a
; crash does not wipe it. Does nothing until the game crashes.
crash_dump=1
; 1 writes one line when the game ends, naming the code that ended it (exit: ...). On GOG
; a .NET runtime in the process (most likely Galaxy's overlay) ends it before this DLL can
; say goodbye, so without it the log just stops. Logging only. 0 = off.
exit_trace=1
